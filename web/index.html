<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101319">
  <title>鋼鐵迷都</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #101319; color: #e8e2d4;
      overflow: hidden; overscroll-behavior: none;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }
    /* 安全區：瀏海、圓角、Home 指示條不蓋到畫面（viewport-fit=cover 時 env() 才有值） */
    #game {
      position: fixed;
      top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px);
      overflow: hidden;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game canvas { touch-action: none; display: block; }
    /* 名字輸入框（由 Phaser DOM 容器縮放） */
    .sl-name-input {
      width: 260px; height: 48px; padding: 0 12px;
      font: 20px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #f4efe4; background: #1c212b;
      border: 2px solid #f0a848; border-radius: 6px; outline: none;
      text-align: center;
      -webkit-user-select: text; user-select: text;
    }
    .sl-name-input:focus { border-color: #ffd08a; box-shadow: 0 0 0 3px rgba(240, 168, 72, 0.25); }
    /* 轉移碼輸入框：大寫等寬顯示（值本身不變，送出前再正規化） */
    .sl-code-input { font-size: 22px; letter-spacing: 3px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
    .sl-code-input::placeholder { color: #5c6573; letter-spacing: 3px; }
    /* 夢客自由交談（DreamChatScene）：紀錄與輸入框都只放純文字（textContent） */
    .sl-chat-log {
      overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
      padding: 10px 8px; /* Phaser 會改 DOM 元素的 display，所以不用 flex 排版 */
      background: rgba(14, 20, 36, 0.78); border: 1px solid #2e3a56; border-radius: 8px;
      font-size: 15px; line-height: 1.55; color: #e4e9f5;
      -webkit-user-select: text; user-select: text;
    }
    .sl-msg { width: fit-content; max-width: 82%; margin: 0 0 10px; padding: 7px 11px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .sl-msg-guest { margin-right: auto; background: #1d2a48; border: 1px solid #3c5288; border-top-left-radius: 2px; }
    .sl-msg-player { margin-left: auto; background: #3a3020; border: 1px solid #b8692a; color: #f4e6cc; border-top-right-radius: 2px; }
    .sl-msg-who { font-size: 11px; color: #9fb4e6; margin-bottom: 2px; font-weight: 700; }
    /* 預寫台詞（伺服器 source: scripted、或連線失敗時的 fallback）：斜體、淡色 */
    .sl-msg-scripted { background: #172036; border-style: dashed; border-color: #34446a; }
    .sl-msg-scripted .sl-msg-text { font-style: italic; color: #a9b6d2; }
    .sl-msg-greeting .sl-msg-text { color: #c8d4ee; }
    .sl-msg-unsent { opacity: 0.6; border-style: dashed; }
    .sl-msg-note { font-size: 11px; color: #f0a848; margin-top: 2px; }
    .sl-msg-waiting { letter-spacing: 4px; color: #9fb4e6; animation: sl-wait 1.1s ease-in-out infinite; }
    @keyframes sl-wait { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .sl-chat-input {
      width: 256px; height: 46px; padding: 0 12px;
      font: 16px "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #f4efe4; background: #141b2c; border: 2px solid #6f86b8; border-radius: 6px; outline: none;
      -webkit-user-select: text; user-select: text;
    }
    .sl-chat-input:focus { border-color: #a9c0f0; box-shadow: 0 0 0 3px rgba(111, 134, 184, 0.3); }
    .sl-chat-input:disabled { opacity: 0.5; }
    .sl-chat-input::placeholder { color: #5c6a86; }
    /* Turnstile 小工具的容器（內容由 Cloudflare 的 iframe 產生） */
    .sl-turnstile { width: 300px; min-height: 65px; display: flex; align-items: center; justify-content: center; }
    #boot-error {
      position: fixed; inset: 0; display: none; padding: 24px 16px;
      overflow: auto; white-space: pre-wrap; line-height: 1.6;
      background: #101319; color: #f3c9a0; font-size: 15px;
    }
    noscript { display: block; padding: 24px 16px; }
  </style>
</head>
<body>
  <noscript>這個遊戲需要啟用 JavaScript 才能遊玩。</noscript>
  <div id="game"></div>
  <div id="boot-error" role="alert"></div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
