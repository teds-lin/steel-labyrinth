name: 發布 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stamp-version 要數當天 commit 數，需要完整歷史
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: node tools/stamp-version.mjs # 測試通過後才寫入版本號（只改工作區的 web/src/version.js，不 commit）；測試跑的版本檔與 repo 相同（dev）
      # 所有同源資源網址加上 ?v=<版本>（index.html 的 script／link、模組的 import），並驗證沒有漏網之魚（漏了就失敗、不發布）。
      # 避免 Pages 的 max-age=600 快取讓新舊版本的模組混用 → 模組連結失敗 → 黑畫面。只改工作區，不 commit。
      - run: node tools/stamp-urls.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
