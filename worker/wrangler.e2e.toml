# 《鋼鐵迷都》Worker 的本機 E2E 設定（M4）。**只給 `wrangler dev --local` 使用，絕對不要拿來部署。**
# 與 wrangler.toml 的差別（tests/worker/config.test.js 把關，其餘 vars 必須相同）：
# - 沒有 [ai] 綁定：Workers AI 在 wrangler dev 一律連到 Cloudflare（需要登入、會產生用量），E2E 改用 Worker 內建的模擬 AI（DREAM_FAKE_AI=1，
#   只有在沒有 AI 綁定時才會生效）。
# - Turnstile 用 Cloudflare 官方測試金鑰並允許離線模擬（TURNSTILE_ALLOW_TEST_SECRET=1）；通行證金鑰是本機專用值。
# - D1 的 database_id 是假的（本機只當識別字串）；名稱不同、沒有 Cron。誤用來部署也綁不到正式資料庫。
# 用法：npx wrangler d1 migrations apply steel-labyrinth --local --config worker/wrangler.e2e.toml
#       npx wrangler dev --local --config worker/wrangler.e2e.toml --port 8787 --var ALLOWED_ORIGINS:<本機來源,…>
name = "steel-labyrinth-e2e-local-only"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "steel-labyrinth"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# 正式只允許 GitHub Pages。本機開發與測試用 `--var ALLOWED_ORIGINS:...` 覆寫（見 package.json 的 worker:dev）。
ALLOWED_ORIGINS = "https://teds-lin.github.io"
# 頻率限制（每小時次數，固定時間窗；修訂 4 第 1 節降低每位玩家配額）
RL_PLAYER_PER_HOUR = "5"     # 建立玩家：同一 IP（IPv6 以 /64 計）
RL_TRANSFER_PER_HOUR = "10"  # 轉移碼嘗試：同一 IP（成功失敗都算；碰撞 409 也算）
RL_PLAYER_PER_HOUR_V6_48 = "10"    # 建立玩家：同一 IPv6 /48（修訂 4）
RL_TRANSFER_PER_HOUR_V6_48 = "20"  # 轉移碼嘗試：同一 IPv6 /48（修訂 4）
RL_WRITE_PER_HOUR = "20"     # 存檔寫入：同一玩家（PUT＋DELETE 合計）
RL_ROTATE_PER_HOUR = "3"     # 重新產生轉移碼：同一玩家（重送已生效的碼不計）
RL_CLEAR_PER_HOUR = "10"     # 回報通關：同一玩家
RL_RESERVED_PER_HOUR = "3"   # 保留通道：同一玩家每小時前 3 次寫入（PUT、DELETE、clear、rotate 合計）不受全域每小時上限，改計入全域每日預算
# 全域上限（不分來源；修訂 3／3a／4）。惡意流量每日寫入上限由 tests/worker/cron-cost.test.js 用這些值計算並斷言 < 10 萬列。
RL_PLAYER_GLOBAL_PER_HOUR = "60"     # 建立玩家：全部來源合計
RL_TRANSFER_GLOBAL_PER_HOUR = "120"  # 轉移碼嘗試（含碰撞 409）：全部來源合計（修訂 3a）
RL_WRITE_GLOBAL_PER_HOUR = "100"     # （修訂 4a）已登入的寫入（PUT＋DELETE＋clear＋rotate），保留通道以外：全部玩家合計
RL_WRITE_GLOBAL_PER_DAY = "4000"     # （修訂 4）保留通道的全域每日預算（UTC 日）；由 cron-cost.test.js 的算式推算（見 docs/API.md 修訂 4a）
# 容量上限：玩家數達到後 POST /api/player 回 503 capacity（5000 × 3 格 × 16 KB ≈ 240 MB，低於 D1 免費 500 MB 的一半）
MAX_PLAYERS = "5000"
# Cron 每次最多刪除的玩家數（含其存檔、通關紀錄；修訂 4 第 2 節）
PURGE_BATCH = "500"
# 回報通關的遊戲時間上限（秒，10 小時；修訂 4 第 7 節）
MAX_PLAYER_SECONDS = "36000"
# 統計：完成人數少於這個數的章節不公開
STATS_MIN_PLAYERS = "3"
# 允許回報通關的章節，必須等於 web/data/manifest.json 的 chapters（tests/worker/clear-stats.test.js 把關）
CHAPTERS = "prologue,chapter1,chapter2,chapter3"

# ---------- M4 鐘塔之夢（docs/API.md「鐘塔之夢」；模型與 neurons 依 steel-labyrinth-design/plans/M4-model-eval.md） ----------
# Turnstile：siteverify 回傳的 hostname 必須在清單內（逗號分隔）。本機與 E2E 用 --var 覆寫（見 worker/README.md）。
TURNSTILE_HOSTNAMES = "teds-lin.github.io"   # 測試金鑰的離線模擬不檢查 hostname
# 夢境通行證：同一玩家每小時 6 次；全站每小時上限（計入每日寫入上限，見 tests/worker/cron-cost.test.js）
RL_DREAM_PASS_PER_HOUR = "6"
RL_DREAM_PASS_GLOBAL_PER_HOUR = "30"   # 一張通行證 30 分鐘；全站每小時 30 張約可支撐 15 位同時入夢的玩家
# 夢客模型（評測完成後只改這裡）。參數固定：temperature 0.7、chat_template_kwargs.enable_thinking=false
DREAM_MODEL = "@cf/google/gemma-4-26b-a4b-it"
DREAM_MAX_TOKENS = "200"          # 實測輸出最多約 100 tokens
# 額度：每位玩家每 UTC 日幾句（scripted 不扣）；全站每日 neurons 預算
DREAM_CHATS_PER_DAY = "20"
DREAM_NEURONS_PER_DAY = "8000"
DREAM_NEURONS_PER_CALL = "20"     # 每次 AI 呼叫預扣（實測每句約 9.4，帶滿 6 則紀錄約 17.5），呼叫後依 usage 修正
DREAM_NEURONS_MIN_PER_CALL = "8"  # 每次呼叫至少計這麼多（每日最多 8000 ÷ 8 = 1000 次呼叫 → 寫入列數有上限）
# 換算 usage → neurons（1000 neurons = 0.011 美元；gemma-4-26b-a4b-it：輸入 0.10、輸出 0.30 美元／百萬 tokens）。換模型時一起改。
DREAM_NEURONS_PER_M_INPUT = "9091"
DREAM_NEURONS_PER_M_OUTPUT = "27273"

# ---------- 只在本機 E2E ----------
DREAM_FAKE_AI = "1"
TURNSTILE_SECRET = "1x0000000000000000000000000000000AA"
TURNSTILE_ALLOW_TEST_SECRET = "1"
DREAM_PASS_SECRET = "local-e2e-only-dream-pass-secret-0123456789"
TRANSFER_PEPPER = "local-e2e-only-pepper"
