# 《鋼鐵迷都》雲端存檔 Worker（規格：docs/API.md）
# 本機：npm run worker:dev（wrangler dev --local，不需要登入；本機來源與 pepper 用 --var 覆寫）
# 部署步驟見 worker/README.md。密鑰（TRANSFER_PEPPER）用 `wrangler secret put` 設定，不要寫進這個檔案。
name = "steel-labyrinth"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "steel-labyrinth"
# 正式 D1（2026-10-17 以 `wrangler d1 create steel-labyrinth` 建立）。
# 本機（wrangler dev --local、Miniflare 測試）只把它當作識別字串，不會連線到 Cloudflare。
database_id = "fac6b0f7-d6aa-422b-bda1-a0a30446482f"
migrations_dir = "migrations"

# 定期清理（每天一次，UTC 03:17）：刪除 180 天未登入的玩家、超過 7 天沒有使用的空帳號（每次最多 PURGE_BATCH 人）及其資料、過期的限流紀錄。部署時自動註冊，不需另外設定。
[triggers]
crons = ["17 3 * * *"]

[vars]
# 正式只允許 GitHub Pages。本機開發與測試用 `--var ALLOWED_ORIGINS:...` 覆寫（見 package.json 的 worker:dev）。
ALLOWED_ORIGINS = "https://teds-lin.github.io"
# 頻率限制（每小時次數，固定時間窗；修訂 4 第 1 節降低每位玩家配額）
RL_PLAYER_PER_HOUR = "5"     # 建立玩家：同一 IP（IPv6 以 /64 計）
RL_TRANSFER_PER_HOUR = "10"  # 轉移碼嘗試：同一 IP（成功失敗都算；碰撞 409 也算）
RL_PLAYER_PER_HOUR_V6_48 = "10"    # 建立玩家：同一 IPv6 /48（修訂 4）
RL_TRANSFER_PER_HOUR_V6_48 = "20"  # 轉移碼嘗試：同一 IPv6 /48（修訂 4）
RL_WRITE_PER_HOUR = "20"     # 存檔寫入：同一玩家（PUT＋DELETE 合計）
RL_ROTATE_PER_HOUR = "3"     # 重新產生轉移碼：同一玩家（重送已生效的碼不計）
RL_CLEAR_PER_HOUR = "10"     # 回報通關：同一玩家
RL_RESERVED_PER_HOUR = "3"   # 保留通道：同一玩家每小時前 3 次寫入（PUT、DELETE、clear、rotate 合計）不受全域每小時上限，改計入全域每日預算
# 全域上限（不分來源；修訂 3／3a／4）。惡意流量每日寫入上限由 tests/worker/cron-cost.test.js 用這些值計算並斷言 < 10 萬列。
RL_PLAYER_GLOBAL_PER_HOUR = "60"     # 建立玩家：全部來源合計
RL_TRANSFER_GLOBAL_PER_HOUR = "120"  # 轉移碼嘗試（含碰撞 409）：全部來源合計（修訂 3a）
RL_WRITE_GLOBAL_PER_HOUR = "100"     # （修訂 4a）已登入的寫入（PUT＋DELETE＋clear＋rotate），保留通道以外：全部玩家合計
RL_WRITE_GLOBAL_PER_DAY = "4000"     # （修訂 4）保留通道的全域每日預算（UTC 日）；由 cron-cost.test.js 的算式推算（見 docs/API.md 修訂 4a）
# 容量上限：玩家數達到後 POST /api/player 回 503 capacity（5000 × 3 格 × 16 KB ≈ 240 MB，低於 D1 免費 500 MB 的一半）
MAX_PLAYERS = "5000"
# Cron 每次最多刪除的玩家數（含其存檔、通關紀錄；修訂 4 第 2 節）
PURGE_BATCH = "500"
# 回報通關的遊戲時間上限（秒，10 小時；修訂 4 第 7 節）
MAX_PLAYER_SECONDS = "36000"
# 統計：完成人數少於這個數的章節不公開
STATS_MIN_PLAYERS = "3"
# 允許回報通關的章節，必須等於 web/data/manifest.json 的 chapters（tests/worker/clear-stats.test.js 把關）
CHAPTERS = "prologue,chapter1,chapter2"
