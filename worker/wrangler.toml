# 《鋼鐵迷都》雲端存檔 Worker（規格：docs/API.md）
# 本機：npm run worker:dev（wrangler dev --local，不需要登入；本機來源與 pepper 用 --var 覆寫）
# 部署步驟見 worker/README.md。密鑰（TRANSFER_PEPPER）用 `wrangler secret put` 設定，不要寫進這個檔案。
name = "steel-labyrinth"
main = "src/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "steel-labyrinth"
# 部署前要換成 `wrangler d1 create steel-labyrinth` 回傳的 database_id。
# 本機（wrangler dev --local、Miniflare 測試）只把它當作識別字串，不會連線到 Cloudflare。
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# 定期清理（每天一次，UTC 03:17）：刪除 180 天未登入的玩家及其資料、過期的限流紀錄。部署時自動註冊，不需另外設定。
[triggers]
crons = ["17 3 * * *"]

[vars]
# 正式只允許 GitHub Pages。本機開發與測試用 `--var ALLOWED_ORIGINS:...` 覆寫（見 package.json 的 worker:dev）。
ALLOWED_ORIGINS = "https://teds-lin.github.io"
# 頻率限制（每小時次數，固定時間窗）
RL_PLAYER_PER_HOUR = "5"     # 建立玩家：同一 IP
RL_TRANSFER_PER_HOUR = "10"  # 轉移碼嘗試：同一 IP（成功失敗都算）
RL_WRITE_PER_HOUR = "60"     # 存檔寫入：同一玩家（PUT＋DELETE 合計）
RL_ROTATE_PER_HOUR = "10"    # 重新產生轉移碼：同一玩家
RL_CLEAR_PER_HOUR = "30"     # 回報通關：同一玩家
# 全域上限（不分來源；修訂 3／3a）。惡意流量每日寫入上限由 tests/worker/cron-cost.test.js 用這些值計算並斷言 < 10 萬列。
RL_PLAYER_GLOBAL_PER_HOUR = "60"     # 建立玩家：全部來源合計
RL_TRANSFER_GLOBAL_PER_HOUR = "120"  # 轉移碼嘗試：全部來源合計（修訂 3a）
RL_WRITE_GLOBAL_PER_HOUR = "400"     # （修訂 3a）已登入的寫入（PUT＋DELETE＋clear＋rotate）：全部玩家合計
# 容量上限：玩家數達到後 POST /api/player 回 503 capacity（5000 × 3 格 × 16 KB ≈ 240 MB，低於 D1 免費 500 MB 的一半）
MAX_PLAYERS = "5000"
# 統計：完成人數少於這個數的章節不公開
STATS_MIN_PLAYERS = "3"
# 允許回報通關的章節，必須等於 web/data/manifest.json 的 chapters（tests/worker/clear-stats.test.js 把關）
CHAPTERS = "prologue,chapter1,chapter2"
